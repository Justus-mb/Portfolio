/* ============================================================
   DESIGN — Optik einer technischen Zeichnung
   Farben und Grundwerte zentral als Variablen.
   ============================================================ */
:root{
  --papier:#F5F6F3;        /* Seitenhintergrund */
  --blatt:#FFFFFF;         /* Karten / Zeichnungsblätter */
  --tusche:#171B20;        /* Text */
  --grau:#5A6470;          /* Sekundärtext */
  --linie:#C7CDD4;         /* Rahmen- und Hilfslinien */
  --blau:#1F4B99;          /* Bauplanblau — Akzent */
  --rot:#B3401F;           /* Maßlinien-Rot — nur für TODO-Marker */
  --radius:2px;
  --maxw:1120px;
  --font-display:"Saira",sans-serif;
  --font-body:"IBM Plex Sans",sans-serif;
  --font-mono:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
body{
  background:var(--papier);
  color:var(--tusche);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
}
a{color:var(--blau)}
img{max-width:100%;display:block}

/* ---- Wiederkehrende Bausteine ---- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.mono{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--grau)}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--blau);display:flex;align-items:center;gap:12px;margin-bottom:14px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--linie)}
h1,h2,h3{font-family:var(--font-display);line-height:1.15}
h2{font-size:clamp(26px,3.4vw,36px);font-weight:600;margin-bottom:28px}
section{padding:72px 0}
.todo{color:var(--rot);background:rgba(179,64,31,.07);padding:0 4px;border-radius:2px;font-style:normal}

/* ---- Navigation ---- */
header.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(245,246,243,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--linie);
}
header.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px}
/* Name links: darf nie gestaucht oder umgebrochen werden */
.nav-marke{display:flex;align-items:baseline;gap:10px;min-width:0}
.nav-name{font-family:var(--font-display);font-weight:700;font-size:17px;text-decoration:none;color:var(--tusche);white-space:nowrap;flex-shrink:0}
/* Aktueller Abschnitt neben dem Namen (nur mobil sichtbar) */
.nav-aktuell{display:none;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blau);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav ul{display:flex;gap:22px;list-style:none}
nav a{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--grau);white-space:nowrap}
nav a:hover{color:var(--blau)}
/* Aktiver Abschnitt: blau + Unterstrich wie eine Maßlinie */
nav a.aktiv{color:var(--blau);box-shadow:inset 0 -1px 0 var(--blau)}
/* Menü-Knopf (nur mobil) */
.nav-toggle{display:none;flex-shrink:0;width:40px;height:40px;background:none;border:1px solid var(--linie);border-radius:var(--radius);cursor:pointer;position:relative}
.nav-toggle span,.nav-toggle span::before,.nav-toggle span::after{
  position:absolute;left:50%;width:18px;height:1.5px;margin-left:-9px;background:var(--tusche);content:"";transition:transform .2s ease,opacity .2s ease}
.nav-toggle span{top:50%;margin-top:-.75px}
.nav-toggle span::before{left:0;margin-left:0;top:-6px}
.nav-toggle span::after{left:0;margin-left:0;top:6px}
.nav-toggle[aria-expanded="true"] span{background:transparent}
.nav-toggle[aria-expanded="true"] span::before{transform:translateY(6px) rotate(45deg)}
.nav-toggle[aria-expanded="true"] span::after{transform:translateY(-6px) rotate(-45deg)}
.nav-toggle:focus-visible{outline:2px solid var(--blau);outline-offset:2px}

/* Mobil: Navigation als aufklappbares Panel unter der Kopfzeile */
@media(max-width:760px){
  .nav-aktuell{display:inline}
  .nav-toggle{display:block}
  header.nav nav{
    position:absolute;left:0;right:0;top:100%;
    background:var(--papier);border-bottom:1px solid var(--linie);
    display:none;
  }
  header.nav nav.offen{display:block}
  nav ul{flex-direction:column;gap:0;padding:6px 16px 12px}
  nav li{border-top:1px solid var(--linie)}
  nav li:first-child{border-top:none}
  nav a{display:block;padding:13px 2px;font-size:13px}
  nav a.aktiv{box-shadow:none;border-left:2px solid var(--blau);padding-left:10px}
}
/* Sprungziele nicht unter der festen Kopfzeile verstecken */
section[id]{scroll-margin-top:56px}

/* ---- Hero mit Zeichnungsrahmen + Schriftfeld ---- */
.hero{padding:56px 0 72px}
.blatt-rahmen{
  position:relative;background:var(--blatt);
  border:1px solid var(--tusche);
  padding:56px 48px 0;
}
/* Innenrahmen wie bei einer Zeichnung */
.blatt-rahmen::before{
  content:"";position:absolute;inset:10px;
  border:1px solid var(--linie);pointer-events:none;
}
.hero-inner{
  position:relative;z-index:1;padding-bottom:40px;
  display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:44px;align-items:start;
}
.hero-text{max-width:720px}
/* Bild rechts als eigenes Zeichnungsfeld */
.hero-bild{margin:0}
.hero-bild .rahmen{
  position:relative;border:1px solid var(--tusche);background:#fff;
  aspect-ratio:3/4;overflow:hidden;
}
.hero-bild .rahmen::after{
  content:"";position:absolute;inset:6px;border:1px solid var(--linie);pointer-events:none;z-index:1;
}
.hero-bild img{width:100%;height:100%;object-fit:cover;object-position:50% 0}
.hero-bild .platzhalter-bild{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:0 18px;white-space:pre-line;
  font-family:var(--font-mono);font-size:11px;line-height:1.6;color:var(--grau);
  background:repeating-linear-gradient(45deg,#fff,#fff 9px,var(--blatt) 9px,var(--blatt) 18px);
}
.hero-bild figcaption{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--grau);margin-top:8px;padding-top:6px;border-top:1px solid var(--linie);
}
@media(max-width:900px){
  .hero-inner{grid-template-columns:1fr;gap:30px}
  .hero-bild{max-width:260px}
}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:700;letter-spacing:-.01em}
.hero .rolle{font-family:var(--font-mono);font-size:14px;color:var(--blau);margin:10px 0 24px;letter-spacing:.05em}
.hero p{color:var(--grau);max-width:640px;white-space:pre-line}
.hero .cta{display:inline-block;margin-top:28px;background:var(--blau);color:#fff;text-decoration:none;
  font-family:var(--font-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  padding:12px 22px;border-radius:var(--radius)}
.hero .cta:hover{background:#173C7C}
/* Schriftfeld (DIN-Vorbild) unten rechts */
.schriftfeld{
  position:relative;z-index:1;
  margin:0 -48px;margin-top:8px;
  border-top:1px solid var(--tusche);
  display:grid;grid-template-columns:1fr 1fr 1fr 1fr;
  font-family:var(--font-mono);font-size:11px;
}
.schriftfeld div{padding:8px 14px;border-right:1px solid var(--linie)}
.schriftfeld div:last-child{border-right:none}
.schriftfeld .lbl{display:block;color:var(--grau);letter-spacing:.08em;text-transform:uppercase;font-size:9px;margin-bottom:2px}
@media(max-width:700px){
  .blatt-rahmen{padding:36px 22px 0}
  .schriftfeld{margin:0 -22px;grid-template-columns:1fr 1fr}
  .schriftfeld div:nth-child(2){border-right:none}
}

/* ---- Profil-Kacheln ---- */
.kacheln{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.kachel{background:var(--blatt);border:1px solid var(--linie);padding:24px;border-radius:var(--radius)}
.kachel h3{font-size:17px;font-weight:600;margin-bottom:8px}
.kachel p{font-size:14.5px;color:var(--grau)}
@media(max-width:800px){.kacheln{grid-template-columns:1fr}}

/* ---- Werdegang ---- */
.werdegang{display:flex;flex-direction:column;gap:0}
.wg-item{display:grid;grid-template-columns:150px 1fr;gap:24px;padding:22px 0;border-top:1px solid var(--linie)}
.wg-item:last-child{border-bottom:1px solid var(--linie)}
.wg-zeit{font-family:var(--font-mono);font-size:13px;color:var(--blau);padding-top:3px}
.wg-item h3{font-size:18px;font-weight:600}
.wg-item .ort{font-size:14px;color:var(--grau);margin:2px 0 8px}
.wg-item p{font-size:14.5px;color:var(--grau)}
@media(max-width:640px){.wg-item{grid-template-columns:1fr;gap:4px}}

/* ---- Projekt-Grid ---- */
/* min(300px,100%): auf schmalen Bildschirmen nie breiter als der Container */
.projekte-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:20px}
.projekt-card{
  background:var(--blatt);border:1px solid var(--linie);border-radius:var(--radius);
  text-align:left;cursor:pointer;font:inherit;color:inherit;
  display:flex;flex-direction:column;overflow:hidden;
  transition:border-color .15s ease, transform .15s ease;
}
.projekt-card:hover,.projekt-card:focus-visible{border-color:var(--blau);transform:translateY(-2px)}
.projekt-card:focus-visible{outline:2px solid var(--blau);outline-offset:2px}
.pc-bild{aspect-ratio:16/10;background:#E9ECEF;position:relative}
.pc-bild img{width:100%;height:100%;object-fit:cover}
.pc-bild .platzhalter{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:11px;color:var(--grau);letter-spacing:.08em;
  background:
    linear-gradient(45deg,transparent 49.6%,var(--linie) 49.6%,var(--linie) 50.4%,transparent 50.4%),
    linear-gradient(-45deg,transparent 49.6%,var(--linie) 49.6%,var(--linie) 50.4%,transparent 50.4%);
}
.pc-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc-nr{font-family:var(--font-mono);font-size:11px;color:var(--blau);letter-spacing:.1em}
.pc-body h3{font-size:17px;font-weight:600}
.pc-body p{font-size:14px;color:var(--grau);flex:1}
.pc-mehr{font-family:var(--font-mono);font-size:12px;color:var(--blau);letter-spacing:.06em;margin-top:8px}

/* ---- Modal / Popup ---- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(23,27,32,.55);z-index:100;
  display:none;align-items:flex-start;justify-content:center;
  padding:5vh 16px;overflow-y:auto;
}
.modal-backdrop.offen{display:flex}
.modal{
  background:var(--blatt);border:1px solid var(--tusche);border-radius:var(--radius);
  max-width:760px;width:100%;position:relative;
}
.modal-kopf{
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--tusche);padding:14px 22px;
}
.modal-kopf .mono{color:var(--blau)}
.modal-close{
  background:none;border:1px solid var(--linie);border-radius:var(--radius);
  width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;color:var(--tusche);
}
.modal-close:hover{border-color:var(--blau);color:var(--blau)}
.modal-body{padding:24px}
.modal-body h3{font-size:24px;margin-bottom:14px}
.modal-body .lang{white-space:pre-line;color:var(--grau);font-size:15px}
.technik{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.technik span{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;
  border:1px solid var(--linie);border-radius:2px;padding:4px 10px;color:var(--tusche);
}
/* Galerie im Modal */
.galerie{position:relative;background:#E9ECEF;aspect-ratio:16/9;margin-bottom:20px;border:1px solid var(--linie)}
.galerie img{width:100%;height:100%;object-fit:contain;background:#fff;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
.galerie img:focus-visible{outline:2px solid var(--blau);outline-offset:-2px}
/* Seitliches Wischen übernimmt das Skript, vertikales Scrollen bleibt beim Browser */
.galerie{touch-action:pan-y;overflow:hidden}

/* ---- Vollbild-Ansicht (Lightbox) ---- */
.lightbox{
  position:fixed;inset:0;z-index:200;display:none;flex-direction:column;
  background:#0C0E11;color:#fff;
}
.lightbox.offen{display:flex}
.lb-kopf{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;
}
.lb-buehne{
  flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  padding:0 8px max(14px,env(safe-area-inset-bottom));
  touch-action:none;overflow:hidden;          /* alle Gesten hier selbst auswerten */
}
.lb-buehne img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);border-radius:var(--radius);
  color:#fff;width:42px;height:42px;font-size:20px;line-height:1;cursor:pointer;
}
.lb-btn:hover{border-color:#fff}
.lb-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:1}
.lb-nav.prev{left:12px}.lb-nav.next{right:12px}
.lb-nav[hidden]{display:none}
/* Auf Touch-Geräten wird gewischt, die Pfeile würden nur das Bild verdecken */
@media(hover:none) and (pointer:coarse){.lb-nav{display:none}}
.galerie .platzhalter{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:12px;color:var(--grau);text-align:center;padding:16px;
}
.gal-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  background:var(--blatt);border:1px solid var(--tusche);border-radius:var(--radius);
  width:38px;height:38px;cursor:pointer;font-size:16px;color:var(--tusche);
}
.gal-btn:hover{color:var(--blau);border-color:var(--blau)}
.gal-btn.prev{left:10px}.gal-btn.next{right:10px}
.gal-zaehler{
  position:absolute;bottom:8px;right:10px;
  font-family:var(--font-mono);font-size:11px;background:var(--blatt);
  border:1px solid var(--linie);padding:2px 8px;
}

/* ---- Kompetenzen ---- */
.komp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.komp-block{background:var(--blatt);border:1px solid var(--linie);border-radius:var(--radius);padding:22px 24px}
.komp-block h3{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--blau);font-weight:500;margin-bottom:14px}
.komp-block table{width:100%;border-collapse:collapse;font-size:14px}
.komp-block td{padding:7px 0;border-top:1px solid var(--linie);vertical-align:top}
.komp-block tr:first-child td{border-top:none}
.komp-block td:first-child{font-weight:500;padding-right:14px;white-space:nowrap}
.komp-block td:last-child{color:var(--grau)}
@media(max-width:800px){.komp-grid{grid-template-columns:1fr}.komp-block td:first-child{white-space:normal}}

/* ---- Kontakt ---- */
.kontakt-box{background:var(--blatt);border:1px solid var(--tusche);padding:40px;text-align:center}
.kontakt-box p{color:var(--grau);margin-bottom:16px}
.kontakt-box .email{font-family:var(--font-mono);font-size:16px}
.kontakt-links{display:flex;gap:16px;justify-content:center;margin-top:16px}
.kontakt-links a{font-family:var(--font-mono);font-size:13px}

/* ---- Footer ---- */
footer{border-top:1px solid var(--linie);padding:22px 0 40px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
footer .footer-recht a{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--grau);text-decoration:none;margin-left:18px;
}
footer .footer-recht a:first-child{margin-left:0}
footer .footer-recht a:hover{color:var(--blau)}

/* ---- Schmale Smartphones ---- */
body{overflow-x:clip}                  /* Sicherheitsnetz gegen seitliches Wackeln (clip statt hidden, damit die Kopfzeile sticky bleibt) */
body{overflow-wrap:break-word}         /* lange Wörter brechen statt Überbreite */
@media(max-width:480px){
  .wrap{padding:0 16px}
  section{padding:52px 0}
  .hero{padding:28px 0 52px}
  .blatt-rahmen{padding:30px 16px 0}
  .schriftfeld{margin:0 -16px}
  .kontakt-box{padding:28px 18px}
  .modal-backdrop{padding:12px 8px}
  .modal-body{padding:18px}
  .modal-kopf{padding:12px 16px}
}
</style>
</head>

      <a class="nav-name" href="#top" id="navName"></a>
      <span class="nav-aktuell" id="navAktuell" aria-hidden="true"></span>

    <button class="nav-toggle" id="navToggle" type="button"
            aria-expanded="false" aria-controls="hauptnav" aria-label="Menü öffnen"><span></span></button>
    <nav aria-label="Hauptnavigation" id="hauptnav">
      <ul>
        <li><a href="#profil">Profil</a></li>
        <li><a href="#werdegang">Werdegang</a></li>
        <li><a href="#projekte">Projekte</a></li>
        <li><a href="#kompetenzen">Kompetenzen</a></li>
        <li><a href="#kontakt">Kontakt</a></li>
      </ul>

</header>

<main id="top">

  <!-- Hero als Zeichnungsblatt mit Schriftfeld -->
  <section class="hero" id="profil">

          <div class="hero-text">
            <h1 id="heroName"></h1>
            <div class="rolle" id="heroRolle"></div>
            <p id="heroText"></p>
            <a class="cta" href="#projekte">Projekte ansehen</a>
          </div>
          <figure class="hero-bild">
            <div class="rahmen" id="heroBildRahmen"></div>
            <figcaption id="heroBildUnterschrift"></figcaption>
          </figure>
        </div>
        <div class="schriftfeld" aria-hidden="true">
          <div><span class="lbl">Name</span><span id="sfName"></span></div>
          <div><span class="lbl">Fachrichtung</span>Maschinenbau</div>

          <div><span class="lbl">Stand</span><span id="sfDatum"></span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Profil-Kacheln -->
  <section style="padding-top:0">
    <div class="wrap">
      <div class="kacheln" id="kacheln"></div>
    </div>
  </section>

  <!-- Werdegang -->
  <section id="werdegang">
    <div class="wrap">
      <div class="eyebrow">Werdegang</div>
      <h2>Studium &amp; Praxis — parallel</h2>
      <div class="werdegang" id="werdegangListe"></div>
    </div>
  </section>

  <!-- Projekte -->
  <section id="projekte">
    <div class="wrap">
      <div class="eyebrow">Projekte</div>
      <h2>Ausgewählte Projekte</h2>
      <div class="projekte-grid" id="projekteGrid"></div>
    </div>
  </section>

  <!-- Kompetenzen -->
  <section id="kompetenzen">
    <div class="wrap">
      <div class="eyebrow">Kompetenzen</div>
      <h2>Werkzeuge &amp; Fähigkeiten</h2>
      <div class="komp-grid" id="kompGrid"></div>
    </div>
  </section>

  <!-- Kontakt -->
  <section id="kontakt">
    <div class="wrap">
      <div class="eyebrow">Kontakt</div>
      <div class="kontakt-box">
        <p id="kontaktText"></p>
        <div class="email" id="kontaktEmail"></div>
        <div class="kontakt-links" id="kontaktLinks"></div>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <span class="mono" id="footerZeile"></span>
    <span class="footer-recht">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
    </span>
  </div>
</footer>

<!-- Projekt-Popup -->
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitel">
  <div class="modal">
    <div class="modal-kopf">
      <span class="mono" id="modalNr"></span>
      <button class="modal-close" type="button" aria-label="Schließen" onclick="schliesseModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Vollbild-Ansicht für Projektbilder -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Bild im Vollbild">
  <div class="lb-kopf">
    <span id="lbZaehler"></span>
    <button class="lb-btn lb-close" type="button" aria-label="Vollbild schließen" onclick="schliesseLightbox()">×</button>
  </div>
  <div class="lb-buehne" id="lbBuehne"></div>
  <button class="lb-btn lb-nav prev" type="button" aria-label="Vorheriges Bild" onclick="galWechsel(-1)">‹</button>
  <button class="lb-btn lb-nav next" type="button" aria-label="Nächstes Bild" onclick="galWechsel(1)">›</button>
</div>

<script>
/* ============================================================
   RENDER-LOGIK — muss nicht bearbeitet werden.
   Liest CONTENT und baut die Seite auf.
   ============================================================ */

// [TODO: ...] im Text sichtbar rot markieren
function markiereTodos(text){
  return text.replace(/\[TODO:[^\]]*\]/g, m => `<em class="todo">${m}</em>`);
}
function absatzHtml(text){
  return markiereTodos(text)
    .split("\n\n").map(a => a).join("\n\n"); // pre-line übernimmt die Umbrüche
}

// ---- Kopf / Hero ----
document.title = CONTENT.name + " — Portfolio";
document.getElementById("navName").textContent = CONTENT.name;
document.getElementById("heroName").textContent = CONTENT.name;
document.getElementById("heroRolle").textContent = CONTENT.titel + "  ·  " + CONTENT.untertitel;
document.getElementById("heroText").innerHTML = absatzHtml(CONTENT.ueberMich);
// Bild im Kopf: nur einbinden, wenn im CONTENT eine Datei steht.
// Laedt die Datei nicht (Pfad falsch oder Datei fehlt), greift onerror
// und ersetzt das Bild durch einen neutralen Platzhalter.
(function heroBildAufbauen(){
  const cfg = CONTENT.heroBild || {};
  const rahmen = document.getElementById("heroBildRahmen");
  const unterschrift = document.getElementById("heroBildUnterschrift");
  const pfad = cfg.datei || "Bilder/Portrait.jpg";

  const platzhalter = () => {
    rahmen.innerHTML =
      '<div class="platzhalter-bild">Noch kein Foto hinterlegt\nDatei unter \u201e' +
      pfad + '\u201c ablegen</div>';
  };

  if (!cfg.datei){
    platzhalter();
  } else {
    const bild = new Image();
    bild.alt = cfg.alt || CONTENT.name;
    bild.onerror = platzhalter;
    bild.src = pfad;
    // Ausschnitt aus CONTENT anwenden (Zoom um den Fokuspunkt)
    const zoom = Number(cfg.zoom) || 1;
    if (zoom !== 1){
      bild.style.transformOrigin = cfg.fokus || "50% 10%";
      bild.style.transform = `scale(${zoom})`;
    }
    rahmen.appendChild(bild);
  }

  unterschrift.textContent = cfg.bildunterschrift || CONTENT.titel;
})();

document.getElementById("sfName").textContent = CONTENT.name;
document.getElementById("sfDatum").textContent =
  new Date().toLocaleDateString("de-DE", {year:"numeric", month:"2-digit"});
document.getElementById("footerZeile").textContent =
   new Date().getFullYear() + " " + CONTENT.name;

// ---- Kacheln ----
document.getElementById("kacheln").innerHTML = CONTENT.kacheln.map(k => `
  <div class="kachel">
    <h3>${k.titel}</h3>
    <p>${markiereTodos(k.text)}</p>
  </div>`).join("");

// ---- Werdegang ----
document.getElementById("werdegangListe").innerHTML = CONTENT.werdegang.map(w => `
  <div class="wg-item">
    <div class="wg-zeit">${w.zeitraum}</div>
    <div>
      <h3>${w.titel}</h3>
      <div class="ort">${markiereTodos(w.ort)}</div>
      <p>${markiereTodos(w.text)}</p>
    </div>
  </div>`).join("");

// ---- Projekte ----
const projekte = CONTENT.projekte.filter(p => p.sichtbar !== false);

// Projektnummer wird beim Rendern vergeben: laufend ueber die sichtbaren
// Projekte, in der Reihenfolge des CONTENT-Arrays. Umsortieren oder
// Ausblenden nummeriert automatisch neu, ohne Luecken.
const projektNr = i => "PRJ-" + String(i + 1).padStart(3, "0");

document.getElementById("projekteGrid").innerHTML = projekte.map((p, i) => `
  <button class="projekt-card" type="button" onclick="oeffneProjekt(${i})" aria-haspopup="dialog">
    <div class="pc-bild">
      <div class="platzhalter">Bild folgt</div>
      ${p.bilder && p.bilder.length ? `<img src="${p.bilder[0]}" alt="${p.titel}" loading="lazy"
        onload="this.previousElementSibling && (this.previousElementSibling.style.display='none')"
        onerror="this.remove()">` : ""}
    </div>
    <div class="pc-body">
      <span class="pc-nr">${projektNr(i)}</span>
      <h3>${p.titel}</h3>
      <p>${markiereTodos(p.kurz)}</p>
      <span class="pc-mehr">Details öffnen →</span>
    </div>
  </button>`).join("");

// ---- Kompetenzen ----
document.getElementById("kompGrid").innerHTML = CONTENT.kompetenzen.map(b => `
  <div class="komp-block">
    <h3>${b.bereich}</h3>
    <table>${b.eintraege.map(e => `
      <tr><td>${e.name}</td><td>${markiereTodos(e.niveau)}</td></tr>`).join("")}
    </table>
  </div>`).join("");

// ---- Kontakt ----
document.getElementById("kontaktText").innerHTML = markiereTodos(CONTENT.kontakt.text);
const emailEl = document.getElementById("kontaktEmail");
if (CONTENT.kontakt.email.includes("[TODO")) {
  emailEl.innerHTML = markiereTodos(CONTENT.kontakt.email);
} else {
  emailEl.innerHTML = `<a href="mailto:${CONTENT.kontakt.email}">${CONTENT.kontakt.email}</a>`;
}
document.getElementById("kontaktLinks").innerHTML = (CONTENT.kontakt.links || [])
  .map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join("");

// ---- Navigation: Menü mobil auf-/zuklappen ----
const navToggle = document.getElementById("navToggle");
const hauptnav  = document.getElementById("hauptnav");

function setzeMenu(offen){
  hauptnav.classList.toggle("offen", offen);
  navToggle.setAttribute("aria-expanded", offen ? "true" : "false");
  navToggle.setAttribute("aria-label", offen ? "Menü schließen" : "Menü öffnen");
}
navToggle.addEventListener("click", () => setzeMenu(!hauptnav.classList.contains("offen")));
// Nach Klick auf einen Menüpunkt wieder schließen
hauptnav.addEventListener("click", e => { if (e.target.closest("a")) setzeMenu(false); });
// Klick außerhalb der Kopfzeile oder Escape schließt das Menü
document.addEventListener("click", e => {
  if (hauptnav.classList.contains("offen") && !e.target.closest("header.nav")) setzeMenu(false);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && hauptnav.classList.contains("offen")){ setzeMenu(false); navToggle.focus(); }
});
// Beim Wechsel auf Desktop-Breite Menüzustand zurücksetzen
window.matchMedia("(min-width:761px)").addEventListener("change", e => { if (e.matches) setzeMenu(false); });

// ---- Navigation: aktuellen Abschnitt mitlaufend anzeigen ----
// Ein Abschnitt gilt als aktiv, sobald seine Oberkante ein Drittel
// der Fensterhöhe erreicht hat. Am Seitenende ist immer der letzte aktiv.
const navLinks   = [...hauptnav.querySelectorAll('a[href^="#"]')];
const abschnitte = navLinks.map(a => document.querySelector(a.getAttribute("href"))).filter(Boolean);
const navAktuell = document.getElementById("navAktuell");
let aktivId = null;

function aktualisiereAktiv(){
  const linie = window.innerHeight / 3;
  let aktiv = abschnitte[0];
  for (const s of abschnitte){
    if (s.getBoundingClientRect().top <= linie) aktiv = s;
  }
  const amEnde = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
  if (amEnde) aktiv = abschnitte[abschnitte.length - 1];
  if (!aktiv || aktiv.id === aktivId) return;
  aktivId = aktiv.id;
  navLinks.forEach(a => {
    const istAktiv = a.getAttribute("href") === "#" + aktivId;
    a.classList.toggle("aktiv", istAktiv);
    if (istAktiv){
      a.setAttribute("aria-current", "location");
      navAktuell.textContent = "/ " + a.textContent;
    } else {
      a.removeAttribute("aria-current");
    }
  });
}
// Scroll-Events per requestAnimationFrame bündeln (max. 1x pro Frame)
let navTick = false;
window.addEventListener("scroll", () => {
  if (navTick) return;
  navTick = true;
  requestAnimationFrame(() => { aktualisiereAktiv(); navTick = false; });
}, { passive: true });
window.addEventListener("resize", aktualisiereAktiv);
aktualisiereAktiv();

// ---- Modal-Steuerung ----
const backdrop = document.getElementById("modalBackdrop");
const modalBody = document.getElementById("modalBody");
const modalNr = document.getElementById("modalNr");
let galIndex = 0, galBilder = [];
let letzterFokus = null;

function oeffneProjekt(i){
  const p = projekte[i];
  galBilder = p.bilder || [];
  galIndex = 0;
  modalNr.textContent = projektNr(i) + " — Projektblatt";
  modalBody.innerHTML = `
    <div class="galerie" id="galerie"></div>
    <h3 id="modalTitel">${p.titel}</h3>
    <div class="lang">${absatzHtml(p.lang)}</div>
    <div class="technik">${(p.technik||[]).map(t => `<span>${t}</span>`).join("")}</div>`;
  zeigeGalerieBild();
  letzterFokus = document.activeElement;
  backdrop.classList.add("offen");
  document.body.style.overflow = "hidden";
  document.querySelector(".modal-close").focus();
}

function zeigeGalerieBild(){
  const g = document.getElementById("galerie");
  if (!g) return;
  if (!galBilder.length){
    g.innerHTML = `<div class="platzhalter">Noch keine Bilder hinterlegt —\nDateien in den Ordner „Bilder/" legen und im CONTENT-Block eintragen.</div>`;
    return;
  }
  const src = galBilder[galIndex];
  g.innerHTML = `
    <div class="platzhalter">Bild nicht gefunden: ${src}</div>
    <img src="${src}" alt="" style="position:relative" draggable="false"
      tabindex="0" role="button" aria-label="Bild im Vollbild öffnen"
      onload="this.previousElementSibling.style.display='none'">
    ${galBilder.length > 1 ? `
      <button class="gal-btn prev" type="button" aria-label="Vorheriges Bild" onclick="galWechsel(-1)">‹</button>
      <button class="gal-btn next" type="button" aria-label="Nächstes Bild" onclick="galWechsel(1)">›</button>
      <span class="gal-zaehler">${galIndex+1} / ${galBilder.length}</span>` : ""}`;
}
function galWechsel(richtung){
  if (galBilder.length < 2) return;
  galIndex = (galIndex + richtung + galBilder.length) % galBilder.length;
  zeigeGalerieBild();
  if (lbOffen()) zeigeLightboxBild();
}

// ---- Wischgeste (Touch, Stift und Maus über Pointer-Events) ----
// el:        Fläche, auf der gewischt wird
// bildVon(): liefert das Bild, das beim Ziehen mitwandert
// optionen:  onWisch(richtung) bei Wisch links/rechts, onTipp() bei kurzem
//            Antippen, onRunter() bei Wisch nach unten (optional)
const WISCH_MIN = 50;   // ab so vielen px gilt eine Bewegung als Wisch
const TIPP_MAX  = 10;   // bis so vielen px gilt sie als Antippen

function wischGeste(el, bildVon, { onWisch, onTipp, onRunter }){
  let start = null;

  el.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest("button")) return;  // Pfeil-Knöpfe nicht abfangen
    start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    const bild = bildVon();
    if (bild) bild.style.transition = "none";
  });

  el.addEventListener("pointermove", e => {
    if (!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    const bild = bildVon();
    if (!bild) return;
    // Bild folgt dem Finger: seitlich beim Blättern, nach unten beim Schließen
    if (Math.abs(dx) > Math.abs(dy)) bild.style.transform = `translateX(${dx}px)`;
    else if (onRunter && dy > 0)     bild.style.transform = `translateY(${dy}px)`;
  });

  const ende = e => {
    if (!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;
    const bild = bildVon();
    if (bild){ bild.style.transition = "transform .2s ease"; bild.style.transform = ""; }
    if (e.type === "pointercancel") return;                 // Browser hat die Geste übernommen (z. B. Scrollen)
    if (Math.abs(dx) >= WISCH_MIN && Math.abs(dx) > Math.abs(dy)) onWisch(dx < 0 ? 1 : -1);
    else if (onRunter && dy >= WISCH_MIN * 1.6 && dy > Math.abs(dx)) onRunter();
    else if (Math.abs(dx) < TIPP_MAX && Math.abs(dy) < TIPP_MAX && onTipp) onTipp(e);
  };
  el.addEventListener("pointerup", ende);
  el.addEventListener("pointercancel", ende);
}

// Galerie im Projektblatt: Wischen blättert, Antippen öffnet Vollbild
wischGeste(modalBody, () => document.querySelector("#galerie img"), {
  onWisch: galWechsel,
  onTipp: e => { if (e.target.closest("#galerie img")) oeffneLightbox(); }
});

// ---- Vollbild-Ansicht (Lightbox) ----
const lightbox  = document.getElementById("lightbox");
const lbBuehne  = document.getElementById("lbBuehne");
const lbZaehler = document.getElementById("lbZaehler");
const lbOffen   = () => lightbox.classList.contains("offen");

function oeffneLightbox(){
  if (!galBilder.length) return;
  zeigeLightboxBild();
  lightbox.classList.add("offen");
  lightbox.querySelector(".lb-close").focus();
}
function schliesseLightbox(){
  lightbox.classList.remove("offen");
  const g = document.querySelector("#galerie img");
  if (g) g.focus({ preventScroll: true });
}
function zeigeLightboxBild(){
  const src = galBilder[galIndex];
  lbBuehne.innerHTML = `<img src="${src}" alt="" draggable="false">`;
  const mehrere = galBilder.length > 1;
  lbZaehler.textContent = mehrere ? `${galIndex + 1} / ${galBilder.length}` : "";
  lightbox.querySelectorAll(".lb-nav").forEach(b => b.hidden = !mehrere);
  // Nachbarbilder vorladen, damit das Wischen ohne Wartezeit wechselt
  if (mehrere){
    [1, -1].forEach(r => { new Image().src = galBilder[(galIndex + r + galBilder.length) % galBilder.length]; });
  }
}
// Vollbild: Wischen blättert, nach unten wischen oder Tippen neben das Bild schließt
wischGeste(lbBuehne, () => lbBuehne.querySelector("img"), {
  onWisch: galWechsel,
  onRunter: schliesseLightbox,
  onTipp: e => { if (!e.target.closest("img")) schliesseLightbox(); }
});

function schliesseModal(){
  backdrop.classList.remove("offen");
  document.body.style.overflow = "";
  if (letzterFokus) letzterFokus.focus();
}
backdrop.addEventListener("click", e => { if (e.target === backdrop) schliesseModal(); });
document.addEventListener("keydown", e => {
  if (!backdrop.classList.contains("offen")) return;
  // Escape schließt zuerst das Vollbild, erst beim zweiten Mal das Projektblatt
  if (e.key === "Escape") { lbOffen() ? schliesseLightbox() : schliesseModal(); return; }
  if (e.key === "ArrowLeft")  galWechsel(-1);
  if (e.key === "ArrowRight") galWechsel(1);
  // Enter auf dem fokussierten Galeriebild öffnet das Vollbild
  if (e.key === "Enter" && e.target.matches && e.target.matches("#galerie img")) oeffneLightbox();
});
</script>
</body>
